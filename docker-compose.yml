services:
  route-crafter:
    image: ${ROUTE_CRAFTER_IMAGE:-route-crafter:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ROUTE_CRAFTER_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
